
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas直线绘制工具</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 90%;
      max-width: 1000px;
    }
    h1 {
      color: #2d3436;
      text-align: center;
      margin-bottom: 20px;
    }
    .canvas-container {
      position: relative;
      border: 2px solid #636e72;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      background: white;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin: 20px 0;
      justify-content: center;
    }
    .control-group {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      min-width: 200px;
    }
    .control-group h3 {
      margin-top: 0;
      color: #0984e3;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    button {
      background: #0984e3;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      margin: 5px;
    }
    button:hover {
      background: #0767b1;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    input, select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 5px 0;
    }
    .color-picker {
      display: flex;
      align-items: center;
    }
    .color-picker input {
      width: 50px;
      height: 30px;
      padding: 0;
      margin-left: 10px;
    }
    .status {
      text-align: center;
      color: #7f8c8d;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Canvas直线绘制工具</h1>
    
    <div class="canvas-container">
      <canvas id="drawingCanvas" width="800" height="500"></canvas>
    </div>
    
    <div class="controls">
      <div class="control-group">
        <h3>画笔设置</h3>
        <div>
          <label>线条宽度: <input type="number" id="lineWidth" value="3" min="1" max="20"></label>
        </div>
        <div class="color-picker">
          <label>线条颜色:</label>
          <input type="color" id="lineColor" value="#0984e3">
        </div>
        <button id="clearBtn">清空画布</button>
      </div>
      
      <div class="control-group">
        <h3>视图控制</h3>
        <div>
          <label>X偏移: <input type="number" id="offsetX" value="10"></label>
        </div>
        <div>
          <label>Y偏移: <input type="number" id="offsetY" value="10"></label>
        </div>
        <button id="moveBtn">移动视图</button>
      </div>
      
      <div class="control-group">
        <h3>缩放控制</h3>
        <div>
          <label>缩放比例: <input type="number" id="scaleFactor" value="1.1" step="0.1"></label>
        </div>
        <button id="zoomInBtn">放大</button>
        <button id="zoomOutBtn">缩小</button>
        <button id="resetBtn">重置视图</button>
      </div>
    </div>
    
    <p class="status">点击并拖动鼠标绘制直线</p>
  </div>

  <script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const lines = [];
    let isDrawing = false;
    let startPoint = null;
    let currentScale = 1;
    let offsetX = 0;
    let offsetY = 0;
    
    // 初始化画布
    function initCanvas() {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      updateBrushSettings();
    }
    
    // 更新画笔设置
    function updateBrushSettings() {
      ctx.lineWidth = document.getElementById('lineWidth').value;
      ctx.strokeStyle = document.getElementById('lineColor').value;
    }
    
    // 绘制所有直线
    function drawAllLines() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(currentScale, currentScale);
      
      lines.forEach(line => {
        ctx.beginPath();
        ctx.moveTo(line.start.x, line.start.y);
        ctx.lineTo(line.end.x, line.end.y);
        ctx.strokeStyle = line.color;
        ctx.lineWidth = line.width;
        ctx.stroke();
      });
      
      ctx.restore();
    }
    
    // 获取正确的Canvas坐标（考虑缩放和偏移）
    function getCanvasPosition(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left - offsetX) / currentScale;
      const y = (clientY - rect.top - offsetY) / currentScale;
      return { x, y };
    }
    
    // 鼠标事件处理
    canvas.addEventListener('mousedown', (e) => {
      const pos = getCanvasPosition(e.clientX, e.clientY);
      isDrawing = true;
      startPoint = pos;
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      
      const currentPos = getCanvasPosition(e.clientX, e.clientY);
      
      // 实时预览当前绘制的直线
      drawAllLines();
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(currentScale, currentScale);
      
      ctx.beginPath();
      ctx.moveTo(startPoint.x, startPoint.y);
      ctx.lineTo(currentPos.x, currentPos.y);
      ctx.strokeStyle = document.getElementById('lineColor').value;
      ctx.lineWidth = document.getElementById('lineWidth').value;
      ctx.stroke();
      
      ctx.restore();
    });
    
    canvas.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      
      const endPoint = getCanvasPosition(e.clientX, e.clientY);
      
      lines.push({
        start: startPoint,
        end: endPoint,
        width: document.getElementById('lineWidth').value,
        color: document.getElementById('lineColor').value
      });
      
      isDrawing = false;
      startPoint = null;
      drawAllLines();
    });
    
    canvas.addEventListener('mouseleave', () => {
      if (isDrawing) {
        isDrawing = false;
        drawAllLines();
      }
    });
    
    // 控制按钮事件
    document.getElementById('clearBtn').addEventListener('click', () => {
      lines.length = 0;
      drawAllLines();
    });
    
    document.getElementById('moveBtn').addEventListener('click', () => {
      const moveX = parseInt(document.getElementById('offsetX').value);
      const moveY = parseInt(document.getElementById('offsetY').value);
      
      offsetX += moveX;
      offsetY += moveY;
      
      drawAllLines();
    });
    
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      const scaleFactor = parseFloat(document.getElementById('scaleFactor').value);
      const prevScale = currentScale;
      currentScale *= scaleFactor;
      
      // 调整偏移量保持中心点
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      offsetX = centerX - (centerX - offsetX) * (currentScale / prevScale);
      offsetY = centerY - (centerY - offsetY) * (currentScale / prevScale);
      
      drawAllLines();
    });
    
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      const scaleFactor = parseFloat(document.getElementById('scaleFactor').value);
      const prevScale = currentScale;
      currentScale /= scaleFactor;
      
      // 调整偏移量保持中心点
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      offsetX = centerX - (centerX - offsetX) * (currentScale / prevScale);
      offsetY = centerY - (centerY - offsetY) * (currentScale / prevScale);
      
      drawAllLines();
    });
    
    document.getElementById('resetBtn').addEventListener('click', () => {
      currentScale = 1;
      offsetX = 0;
      offsetY = 0;
      drawAllLines();
    });
    
    // 画笔设置变化监听
    document.getElementById('lineWidth').addEventListener('change', updateBrushSettings);
    document.getElementById('lineColor').addEventListener('change', updateBrushSettings);
    
    // 初始化
    initCanvas();
  </script>
</body>
</html>
