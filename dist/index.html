    <div>
      <table>
        <tbody>
          <tr>
            <td>Allow translation:</td>
            <td><input type="checkbox" id="checkboxTranslation" checked="checked" /></td>
          </tr>
          <tr>
            <td>Show rotation:</td>
            <td><input type="checkbox" id="checkboxShowRotation" checked="checked" /></td>
          </tr>
          <tr>
            <td>Allow rotation:</td>
            <td><input type="checkbox" id="checkboxRotation" checked="checked" /></td>
          </tr>
          <tr>
            <td>Keep orthogonality:</td>
            <td><input type="checkbox" id="checkboxOrthogonality" checked="checked" /></td>
          </tr>
          <tr>
            <td>Scale in pixels:</td>
            <td><input type="checkbox" id="checkboxScaleInPixels" checked="checked" /></td>
          </tr>
          <tr>
            <td>Opacity :</td>
            <td>
              <input
                id="opacity"
                type="range"
                min="0"
                max="255"
                step="1"
                value="255"
                style="width: 100px"
              />
            </td>
            <td id="opacityValue">255</td>
          </tr>
          <tr>
            <td>Slab Mode :</td>
            <td>
              <select id="slabMode">
                <option id="slabModeMin" value="0">MIN</option>
                <option id="slabModeMax" value="1">MAX</option>
                <option id="slabModeMean" selected="selected" value="2">MEAN</option>
                <option id="slabModeSum" value="3">SUM</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Slab Number of Slices :</td>
            <td>
              <input
                id="slabNumber"
                type="range"
                min="1"
                max="385.69547573182655"
                step="1"
                value="1"
                style="width: 100px"
              />
            </td>
            <td id="slabNumberValue">1</td>
          </tr>
          <tr>
            <td>Interpolation mode :</td>
            <td>
              <select id="selectInterpolation">
                <option id="nearest" selected="selected">Nearest</option>
                <option id="linear">Linear</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Window Level:</td>
            <td><input type="checkbox" id="checkboxWindowLevel" checked="checked" /></td>
          </tr>
          <tr>
            <td><button id="buttonReset">Reset views</button></td>
          </tr>
          <tr>
            <td><button id="buttonClearAll">清除3D显示</button></td>
          </tr>
          <tr>
            <td>轴向截面(Axial):</td>
            <td><input type="checkbox" id="checkboxAxial" /></td>
          </tr>
          <tr>
            <td>冠状面(Coronal)</td>
            <td><input type="checkbox" id="checkboxCoronal" /></td>
          </tr>
          <tr>
            <td>矢状面(Sagittal)</td>
            <td><input type="checkbox" id="checkboxSagittal" /></td>
          </tr>
          
        </tbody>
      </table>
    </div>
    <div id="container" style="width: 100%;height:500px;border:1px solid red;">

    </div>
    <script src="./webvtk.js"></script>
    <script>
        // 文件选择框的变化事件
      dicomFileInput.addEventListener("change", function (event) {
        const files = event.target.files;
        if (files.length > 0) {
           let ArrayBuffer = pian.f_load_directory(files)
           console.log("ArrayBuffer",ArrayBuffer);
           pian.load(ArrayBuffer)
          // const loader = new pian.Loader()
          // loader.MPR(ArrayBuffer)
        }})

    </script>
</body>
