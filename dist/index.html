<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <input type="file" id="dicomFileInput" webkitdirectory multiple="multiple" />
    <div>
        <label for="axialSlider">Axial (横断面):</label>
        <input type="range" id="axialSlider" min="0" max="100" value="30">
      </div>
      <div>
        <label for="coronalSlider">Coronal (冠状面):</label>
        <input type="range" id="coronalSlider" min="0" max="100" value="50">
      </div>
      <div>
        <label for="sagittalSlider">Sagittal (矢状面):</label>
        <input type="range" id="sagittalSlider" min="0" max="100" value="20">
      </div>
    </div>
    <div id="vtkContainer">
      <div id="axialContainer" style="width: 33%; height: 300px; float: left;border: 1px solid red;"></div>
      <div id="coronalContainer" style="width: 33%; height: 300px; float: left;border: 1px solid red;"></div>
      <div id="sagittalContainer" style="width: 33%; height: 300px; float: left;border: 1px solid red;"></div>
      <div id="3DContainer" style="width: 33%; height: 300px; float: left;border: 1px solid red;"></div>
    </div>
    <script src="./webvtk.js"></script>
    <script>
            const dicomTags = { imagePositionPatient: { id: "0020,0032", //图像在患者坐标系中的位置 
            description: "Image Position (Patient)", }, imageOrientationPatient: { id: "0020,0037", //图像方向矩阵
            description: "Image Orientation (Patient)", }, pixelSpacing: { id: "0028,0030", //像素的物理间距
            description: "Pixel Spacing", }, sliceThickness: { id: "0018,0050",//切片厚度 
            description: "Slice Thickness", }, instanceNumber: { id: "0020,0013", //当前影像序号 
            description: "Instance Number", }, sopInstanceUID: { id: "0008,0018", //唯一标识影像的
            UIDdescription: "SOP Instance UID", }, rescaleIntercept: { id: "0028,1052", //像素值的物理转换截距 
            description: "Rescale Intercept", }, rescaleSlope: { id: "0028,1053", //像素值的物理转换斜率 
            description: "Rescale Slope", }, pixelData: { id: "7FE0,0010",//实际影像像素数据 
            description: "Pixel Data"} }; 
        const controlID = {
            container:{
                containerIds:["axialContainer", "coronalContainer", "sagittalContainer"],
                description:"显示视图内容"
            },
            slider:{
                sliderIds:["axialSlider", "coronalSlider", "sagittalSlider"],
                description:"滑动切换显示层"
            }
        }
        // 文件选择框的变化事件
      dicomFileInput.addEventListener("change", function (event) {
        const files = event.target.files;
        if (files.length > 0) {
           let dicomArrayBuffer = pian.f_load_directory(files)
           console.log("dicomArrayBuffer",dicomArrayBuffer);
           load(dicomArrayBuffer)
        }})
        async function load(dicomArrayBuffer){
            let dicom_tags = pian.getTags(dicomArrayBuffer)
            const dicom_info = pian.processTagsInfo(dicom_tags,dicomTags)
            pian.loadMPR(dicom_info, controlID)
            console.log("dicom_tags",dicom_tags)
            console.log("dicom_info",dicom_info)
        }
    </script>
</body>
</html>
